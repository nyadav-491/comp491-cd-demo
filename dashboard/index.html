<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>COMP 491 Pipeline Dashboard</title>
<style>
 body { margin: 0; font-family: system-ui, sans-serif; background: #EDF3FA; color: #002868; }
 header { padding: 1rem 1.5rem; font-size: 1.3rem; font-weight: 700; }
 header small { font-weight: 400; color: #5B6B7F; font-size: .85rem; margin-left: .5rem; }
 .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; padding: 0 1.5rem 1.5rem; }
 @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
 .env { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
 .label { padding: .7rem 1rem; display: flex; justify-content: space-between; align-items: center; }
 .label b { font-size: 1.05rem; }
 .tag { font-size: .75rem; font-weight: 700; padding: .2rem .5rem; border-radius: 4px; color: #fff; }
 .staging .tag { background: #207BC1; } .production .tag { background: #002868; }
 .ver { font-family: monospace; font-size: .9rem; color: #5B6B7F; padding: 0 1rem .6rem; }
 iframe { width: 100%; height: 300px; border: 0; display: block; }
</style></head><body>
<header>COMP 491 Pipeline Dashboard <small>refreshes every 10 seconds</small></header>
<div class="grid">
  <div class="env staging"><div class="label"><b>Staging</b><span class="tag">UPDATES AUTOMATICALLY</span></div>
    <div class="ver" id="staging-ver">loading...</div><iframe id="staging-frame" title="staging"></iframe></div>
  <div class="env production"><div class="label"><b>Production</b><span class="tag">CUSTOMERS: NEEDS APPROVAL</span></div>
    <div class="ver" id="production-ver">loading...</div><iframe id="production-frame" title="production"></iframe></div>
</div>
<script>
const seen = {};
async function refresh(env) {
  const t = Date.now();
  try {
    const r = await fetch(`${env}/version.json?t=${t}`, { cache: "no-store" });
    if (!r.ok) throw new Error();
    const v = await r.json();
    const key = v.build + v.commit;
    document.getElementById(`${env}-ver`).textContent = `build #${v.build} · commit ${v.commit}`;
    if (seen[env] !== key) {            // only reload the frame when a new build lands
      seen[env] = key;
      document.getElementById(`${env}-frame`).src = `${env}/?t=${t}`;
    }
  } catch {
    document.getElementById(`${env}-ver`).textContent = "not deployed yet";
  }
}
function tick() { refresh("staging"); refresh("production"); }
tick(); setInterval(tick, 10000);
</script>
</body></html>
